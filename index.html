<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Universe - Gesture Controlled</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scaleX(-1);
            opacity: 1.0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 50;
            background: #000;
        }
        #input-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1.0;
        }
        #skeleton-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 10px;
            opacity: 0.8;
            z-index: 10;
            max-width: calc(100% - 40px);
        }
        #shape-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #gesture-hint {
            opacity: 0.5;
            line-height: 1.4;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 100;
            width: 90%;
            max-width: 500px;
        }
        #loading h1 {
            font-size: clamp(24px, 8vw, 48px);
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
        #loading button:hover {
            background: white !important;
            color: black !important;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            #ui {
                top: 15px;
                left: 15px;
            }
            #shape-name {
                font-size: 18px;
                letter-spacing: 2px;
            }
            #gesture-hint {
                font-size: 8px;
            }
            #video-container {
                width: 160px;
                height: 120px;
                bottom: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            #shape-name {
                font-size: 16px;
            }
            #video-container {
                width: 120px;
                height: 90px;
            }
            #start-btn {
                padding: 12px 30px !important;
                font-size: 12px !important;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>PARTICLE UNIVERSE</h1>
        <div id="start-container">
            <button id="start-btn" style="
                background: transparent;
                border: 1px solid #fff;
                color: #fff;
                padding: 15px 40px;
                cursor: pointer;
                font-family: 'Inter', sans-serif;
                letter-spacing: 3px;
                font-size: 14px;
                transition: all 0.3s;
                text-transform: uppercase;
            ">ENTER UNIVERSE</button>
            <p style="font-size: 10px; opacity: 0.5; margin-top: 20px; letter-spacing: 1px;">CAMERA ACCESS REQUIRED FOR GESTURE CONTROL</p>
        </div>
    </div>
    <div id="ui">
        <div id="shape-name">FORMATION: GALAXY</div>
        <div id="gesture-hint">OPEN PALM: EXPLODE | FIST: VORTEX | PINCH: MORPH</div>
    </div>
    <div id="video-container">
        <video id="input-video" muted autoplay playsinline></video>
        <canvas id="skeleton-canvas"></canvas>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js';
        import { AfterimagePass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/AfterimagePass.js';

        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 3000; 
        const SHAPES = ['GALAXY', 'NEBULA', 'DNA', 'FLOWER_OF_LIFE', 'HUMAN'];
        let currentShapeIndex = 0;
        let nextShapeIndex = 0;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 70;

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            powerPreference: "high-performance",
            alpha: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // --- HAND INDICATORS ---
        const handIndicator1 = new THREE.Mesh(
            new THREE.SphereGeometry(1.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 })
        );
        const handIndicator2 = new THREE.Mesh(
            new THREE.SphereGeometry(1.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 })
        );
        handIndicator1.position.set(-1000, 0, 0);
        handIndicator2.position.set(-1000, 0, 0);
        scene.add(handIndicator1);
        scene.add(handIndicator2);

        // --- GROUND PLANE ---
        const floorGeom = new THREE.PlaneGeometry(120, 120);
        const floorMat = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = Math.PI / 2;
        floor.position.y = -45;
        scene.add(floor);

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        
        const afterimagePass = new AfterimagePass(0.88);
        composer.addPass(afterimagePass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.5, 
            0.5, 
            0.1 
        );
        composer.addPass(bloomPass);

        // --- PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const posA = new Float32Array(PARTICLE_COUNT * 3);
        const posB = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);

        const colorPalette = [
            new THREE.Color(0x00d2ff),
            new THREE.Color(0x3a7bd5),
            new THREE.Color(0x6a11cb),
            new THREE.Color(0x2575fc),
            new THREE.Color(0xff0080)
        ];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
            sizes[i] = Math.random() * 1.5 + 0.5;
            
            posA[i * 3] = (Math.random() - 0.5) * 200;
            posA[i * 3 + 1] = (Math.random() - 0.5) * 200;
            posA[i * 3 + 2] = (Math.random() - 0.5) * 200;
            
            posB[i * 3] = posA[i * 3];
            posB[i * 3 + 1] = posA[i * 3 + 1];
            posB[i * 3 + 2] = posA[i * 3 + 2];
        }

        // Initialize with first shape
        generateShape(0, posA);
        generateShape(0, posB);

        geometry.setAttribute('position', new THREE.BufferAttribute(posA, 3));
        geometry.setAttribute('posA', new THREE.BufferAttribute(posA, 3));
        geometry.setAttribute('posB', new THREE.BufferAttribute(posB, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorph: { value: 0 },
                uFingers: { value: new Array(10).fill(null).map(() => new THREE.Vector3(-1000, 0, 0)) },
                uFingerVelocities: { value: new Array(10).fill(null).map(() => new THREE.Vector3(0, 0, 0)) },
                uExplosion: { value: 0 },
                uVortex: { value: 0 },
                uBridge: { value: 0 }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                attribute vec3 posA;
                attribute vec3 posB;
                varying vec3 vColor;
                uniform float uTime;
                uniform float uMorph;
                uniform vec3 uFingers[10];
                uniform vec3 uFingerVelocities[10];
                uniform float uExplosion;
                uniform float uVortex;
                uniform float uBridge;

                void main() {
                    vColor = color;
                    vec3 pos = mix(posA, posB, uMorph);
                    
                    // Subtle floating animation (reduced when interacting)
                    float noise = sin(uTime * 0.4 + pos.y * 0.05) * 0.8;
                    pos.x += noise;
                    pos.y += cos(uTime * 0.4 + pos.x * 0.05) * 0.8;

                    // Multi-finger Interaction
                    for(int i = 0; i < 10; i++) {
                        vec3 fPos = uFingers[i];
                        vec3 fVel = uFingerVelocities[i];
                        if(fPos.x < -500.0) continue;

                        float d = distance(pos, fPos);
                        if(d < 35.0) {
                            float force = smoothstep(35.0, 0.0, d);
                            
                            // 1. Drag Effect: Particles follow finger movement with inertia
                            pos += fVel * force * 25.0;

                            // 2. Repulsion (Explosion)
                            pos += normalize(pos - fPos) * uExplosion * force * 15.0;
                            
                            // 3. Vortex (Swirl)
                            vec3 toFinger = fPos - pos;
                            vec3 orbit = cross(toFinger, vec3(0.0, 0.0, 1.0));
                            pos += normalize(orbit) * uVortex * force * 8.0;

                            // 4. Magnetic Pull: Stronger "stickiness"
                            pos = mix(pos, fPos, force * 0.15);
                        }
                    }

                    // Bridge Interaction (using first finger of each hand as proxies)
                    if(uBridge > 0.1 && uFingers[0].x > -500.0 && uFingers[5].x > -500.0) {
                        vec3 midPoint = mix(uFingers[0], uFingers[5], 0.5);
                        float dMid = distance(pos, midPoint);
                        if(dMid < 25.0) {
                            pos = mix(pos, midPoint, uBridge * 0.15);
                        }
                    }

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (500.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float d = distance(gl_PointCoord, vec2(0.5));
                    if(d > 0.5) discard;
                    float alpha = smoothstep(0.5, 0.1, d);
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        function generateShape(index, targetArray) {
            const shape = SHAPES[index];
            if (shape === 'GALAXY') {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.pow(Math.random(), 0.5) * 50;
                    const spiral = radius * 0.3;
                    targetArray[i * 3] = Math.cos(angle + spiral) * radius;
                    targetArray[i * 3 + 1] = (Math.random() - 0.5) * (10 - radius * 0.15);
                    targetArray[i * 3 + 2] = Math.sin(angle + spiral) * radius;
                }
            } else if (shape === 'NEBULA') {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const r = 40;
                    targetArray[i * 3] = (Math.random() - 0.5) * r * 2;
                    targetArray[i * 3 + 1] = (Math.random() - 0.5) * r * 1.5;
                    targetArray[i * 3 + 2] = (Math.random() - 0.5) * r * 2;
                    if(Math.random() > 0.6) {
                        targetArray[i * 3] *= 0.4;
                        targetArray[i * 3 + 1] *= 0.4;
                        targetArray[i * 3 + 2] *= 0.4;
                    }
                }
            } else if (shape === 'DNA') {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const side = i % 2 === 0 ? 1 : -1;
                    const t = (i / PARTICLE_COUNT) * 80 - 40;
                    const angle = t * 0.6;
                    const r = 12;
                    targetArray[i * 3] = Math.cos(angle) * r * side + (Math.random() - 0.5) * 3;
                    targetArray[i * 3 + 1] = t * 1.2;
                    targetArray[i * 3 + 2] = Math.sin(angle) * r * side + (Math.random() - 0.5) * 3;
                }
            } else if (shape === 'FLOWER_OF_LIFE') {
                const circles = 19;
                const r = 10;
                const step = Math.PI * 2 / 6;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const circleIdx = i % circles;
                    let cx = 0, cy = 0;
                    if(circleIdx > 0) {
                        const layer = Math.ceil((Math.sqrt(12 * circleIdx + 9) - 3) / 6);
                        const posInLayer = circleIdx - (3 * layer * (layer - 1) + 1);
                        const side = Math.floor(posInLayer / layer);
                        const idxInSide = posInLayer % layer;
                        const angle1 = side * step;
                        const angle2 = (side + 1) * step;
                        cx = (Math.cos(angle1) * (layer - idxInSide) + Math.cos(angle2) * idxInSide) * r;
                        cy = (Math.sin(angle1) * (layer - idxInSide) + Math.sin(angle2) * idxInSide) * r;
                    }
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * r;
                    targetArray[i * 3] = cx + Math.cos(angle) * dist;
                    targetArray[i * 3 + 1] = cy + Math.sin(angle) * dist;
                    targetArray[i * 3 + 2] = (Math.random() - 0.5) * 4;
                }
            } else if (shape === 'HUMAN') {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const p = i / PARTICLE_COUNT;
                    let x = 0, y = 0, z = 0;
                    if(p < 0.15) { // Head
                        const angle = Math.random() * Math.PI * 2;
                        const phi = Math.random() * Math.PI;
                        const r = 6;
                        x = Math.sin(phi) * Math.cos(angle) * r;
                        y = Math.cos(phi) * r + 25;
                        z = Math.sin(phi) * Math.sin(angle) * r;
                    } else if(p < 0.55) { // Torso
                        x = (Math.random() - 0.5) * 15;
                        y = (Math.random() - 0.5) * 30 + 5;
                        z = (Math.random() - 0.5) * 10;
                    } else if(p < 0.75) { // Arms
                        const side = Math.random() > 0.5 ? 1 : -1;
                        x = (Math.random() * 22 + 8) * side;
                        y = (Math.random() - 0.5) * 6 + 18;
                        z = (Math.random() - 0.5) * 6;
                    } else { // Legs
                        const side = Math.random() > 0.5 ? 1 : -1;
                        x = (Math.random() * 5 + 4) * side;
                        y = (Math.random() * -30) - 15;
                        z = (Math.random() - 0.5) * 6;
                    }
                    targetArray[i * 3] = x;
                    targetArray[i * 3 + 1] = y;
                    targetArray[i * 3 + 2] = z;
                }
            }
        }

        generateShape(0, posA);
        generateShape(0, posB);
        geometry.attributes.posA.needsUpdate = true;
        geometry.attributes.posB.needsUpdate = true;

        const videoElement = document.getElementById('input-video');
        const hands = new window.Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        let morphing = false;
        let morphStartTime = 0;
        const MORPH_DURATION = 1500;

        const skeletonCanvas = document.getElementById('skeleton-canvas');
        const ctx = skeletonCanvas.getContext('2d');

        // Smoothing for hand positions
        const fingerTargets = new Array(10).fill(null).map(() => new THREE.Vector3(-1000, 0, 0));
        const fingerCurrents = new Array(10).fill(null).map(() => new THREE.Vector3(-1000, 0, 0));
        const fingerVelocities = new Array(10).fill(null).map(() => new THREE.Vector3(0, 0, 0));
        
        const hand1Target = new THREE.Vector3(-1000, 0, 0);
        const hand2Target = new THREE.Vector3(-1000, 0, 0);
        const hand1Current = new THREE.Vector3(-1000, 0, 0);
        const hand2Current = new THREE.Vector3(-1000, 0, 0);

        hands.onResults((results) => {
            // Clear skeleton canvas
            ctx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
            
            // Reset targets
            for(let i = 0; i < 10; i++) fingerTargets[i].set(-1000, 0, 0);
            hand1Target.set(-1000, 0, 0);
            hand2Target.set(-1000, 0, 0);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const palm = landmarks[0];
                    const fingertips = [landmarks[4], landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
                    
                    // Draw skeleton
                    ctx.strokeStyle = index === 0 ? '#00d2ff' : '#ff0080';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    fingertips.forEach(tip => {
                        ctx.moveTo(palm.x * skeletonCanvas.width, palm.y * skeletonCanvas.height);
                        ctx.lineTo(tip.x * skeletonCanvas.width, tip.y * skeletonCanvas.height);
                    });
                    ctx.stroke();

                    // Map to 3D space
                    const offset = index * 5;
                    fingertips.forEach((tip, i) => {
                        // Mirror X for intuitive control
                        const x = (0.5 - tip.x) * 140;
                        const y = (0.5 - tip.y) * 100;
                        const z = (tip.z) * 60;
                        fingerTargets[offset + i].set(x, y, z);
                    });

                    // Palm for indicators
                    const px = (0.5 - palm.x) * 140;
                    const py = (0.5 - palm.y) * 100;
                    const pz = (palm.z) * 60;
                    if(index === 0) hand1Target.set(px, py, pz);
                    else hand2Target.set(px, py, pz);

                    // Gestures
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const middleTip = landmarks[12];
                    const distPinch = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                    const isPinch = distPinch < 0.04;
                    const distFist = Math.hypot(palm.x - middleTip.x, palm.y - middleTip.y);
                    const isFist = distFist < 0.12;
                    const isPalm = distFist > 0.25;

                    if(isPinch && !morphing) {
                        morphing = true;
                        morphStartTime = performance.now();
                        currentShapeIndex = nextShapeIndex;
                        nextShapeIndex = (currentShapeIndex + 1) % SHAPES.length;
                        generateShape(currentShapeIndex, posA);
                        generateShape(nextShapeIndex, posB);
                        geometry.attributes.posA.needsUpdate = true;
                        geometry.attributes.posB.needsUpdate = true;
                        document.getElementById('shape-name').innerText = `FORMATION: ${SHAPES[nextShapeIndex]}`;
                    }

                    if(isFist) {
                        material.uniforms.uVortex.value = THREE.MathUtils.lerp(material.uniforms.uVortex.value, 2.5, 0.15);
                        material.uniforms.uExplosion.value = THREE.MathUtils.lerp(material.uniforms.uExplosion.value, 0, 0.15);
                    } else if(isPalm) {
                        material.uniforms.uExplosion.value = THREE.MathUtils.lerp(material.uniforms.uExplosion.value, 4.0, 0.15);
                        material.uniforms.uVortex.value = THREE.MathUtils.lerp(material.uniforms.uVortex.value, 0, 0.15);
                    } else {
                        material.uniforms.uExplosion.value = THREE.MathUtils.lerp(material.uniforms.uExplosion.value, 0, 0.1);
                        material.uniforms.uVortex.value = THREE.MathUtils.lerp(material.uniforms.uVortex.value, 0, 0.1);
                    }
                });

                if(results.multiHandLandmarks.length === 2) {
                    material.uniforms.uBridge.value = THREE.MathUtils.lerp(material.uniforms.uBridge.value, 1.0, 0.1);
                } else {
                    material.uniforms.uBridge.value = THREE.MathUtils.lerp(material.uniforms.uBridge.value, 0, 0.1);
                }
            } else {
                material.uniforms.uExplosion.value = THREE.MathUtils.lerp(material.uniforms.uExplosion.value, 0, 0.05);
                material.uniforms.uVortex.value = THREE.MathUtils.lerp(material.uniforms.uVortex.value, 0, 0.05);
                material.uniforms.uBridge.value = THREE.MathUtils.lerp(material.uniforms.uBridge.value, 0, 0.05);
            }
        });

        const cameraUtils = new window.Camera(videoElement, {
            onFrame: async () => {
                // Sync canvas size
                if(skeletonCanvas.width !== videoElement.videoWidth) {
                    skeletonCanvas.width = videoElement.videoWidth;
                    skeletonCanvas.height = videoElement.videoHeight;
                }
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        const startBtn = document.getElementById('start-btn');
        const startContainer = document.getElementById('start-container');

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.innerText = "INITIALIZING...";
            
            try {
                // Explicitly request permission first
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                
                // Assign stream to video element to ensure it's active
                videoElement.srcObject = stream;
                await videoElement.play();

                console.log("Camera permission granted. Starting camera...");
                await cameraUtils.start();
                
                // Hide loading screen once camera is running
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                console.error("Camera error:", err);
                const loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    loadingEl.innerHTML = `
                        <div style="color: #ff0080; font-size: 24px; margin-bottom: 20px;">CAMERA ACCESS REQUIRED</div>
                        <div style="font-size: 16px; opacity: 0.8; max-width: 400px; margin: 0 auto 30px; line-height: 1.5;">
                            This universe requires your camera to track hand gestures.<br><br>
                            Please click the button below and select "Allow" when prompted.
                        </div>
                        <button id="grant-btn" style="
                            background: transparent;
                            border: 1px solid #fff;
                            color: #fff;
                            padding: 12px 24px;
                            cursor: pointer;
                            font-family: 'Inter', sans-serif;
                            letter-spacing: 2px;
                            transition: all 0.3s;
                        ">GRANT PERMISSION</button>
                    `;
                    document.getElementById('grant-btn').addEventListener('click', () => {
                        location.reload();
                    });
                }
            }
        });

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            document.getElementById('loading').innerHTML = `
                <div style="color: #ff0080; font-size: 24px; margin-bottom: 20px;">BROWSER NOT SUPPORTED</div>
                <div style="font-size: 16px; opacity: 0.8; max-width: 400px; margin: 0 auto; line-height: 1.5;">
                    Your browser does not support camera access. Please use a modern browser like Chrome, Firefox, or Safari.
                </div>
            `;
            throw new Error("getUserMedia not supported");
        }

        console.log("Camera initialized.");
        
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const time = now * 0.001;
            material.uniforms.uTime.value = time;

            // Smooth hand/finger movement and velocity calculation
            const lerpFactor = 0.3; // Increased for even more responsiveness
            for(let i = 0; i < 10; i++) {
                const prevPos = fingerCurrents[i].clone();
                fingerCurrents[i].lerp(fingerTargets[i], lerpFactor);
                
                // Calculate velocity: current - previous
                if (fingerTargets[i].x > -500) {
                    const newVel = new THREE.Vector3().subVectors(fingerCurrents[i], prevPos);
                    // Low-pass filter for velocity to reduce jitter
                    fingerVelocities[i].lerp(newVel, 0.3);
                } else {
                    fingerVelocities[i].set(0, 0, 0);
                }
            }
            material.uniforms.uFingers.value = fingerCurrents;
            material.uniforms.uFingerVelocities.value = fingerVelocities;

            hand1Current.lerp(hand1Target, lerpFactor);
            hand2Current.lerp(hand2Target, lerpFactor);

            // Update indicators
            handIndicator1.position.copy(hand1Current);
            handIndicator2.position.copy(hand2Current);
            
            // Pulse indicators
            const pulse = 1.0 + Math.sin(time * 10.0) * 0.2;
            handIndicator1.scale.set(pulse, pulse, pulse);
            handIndicator2.scale.set(pulse, pulse, pulse);

            if(morphing) {
                const elapsed = now - morphStartTime;
                const progress = Math.min(elapsed / MORPH_DURATION, 1.0);
                material.uniforms.uMorph.value = THREE.MathUtils.smoothstep(progress, 0, 1);
                
                if(progress >= 1.0) {
                    morphing = false;
                    material.uniforms.uMorph.value = 0;
                    generateShape(nextShapeIndex, posA);
                    geometry.attributes.posA.needsUpdate = true;
                }
            }

            if (hand1Target.x < -500 && hand2Target.x < -500) {
                scene.rotation.y += 0.003;
                scene.rotation.x = Math.sin(time * 0.3) * 0.1;
            } else {
                scene.rotation.y *= 0.98;
                scene.rotation.x *= 0.98;
            }

            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
